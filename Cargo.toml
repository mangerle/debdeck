[package]
name = "debdeck"
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
authors = ["wangle"]
repository = "https://github.com/mangerle/debdeck"
homepage = "https://github.com/mangerle/debdeck"
documentation = "https://github.com/mangerle/debdeck#readme"
readme = "README.md"
keywords = ["apt", "dpkg", "deb", "ubuntu", "gpui"]
default-run = "debdeck"
# 本项目是通过 GitHub Releases 分发的桌面应用，并非 crates.io 库，
# 因此禁止误发布到 crates.io。
publish = false
# 这行不是注释：cargo-deb 与 crates.io 都把它当作 control 的 Description 摘要，
# 缺省会退化成 "[generated from Rust crate debdeck]"。
description = "Ubuntu 的 APT/dpkg 应用管理器"
license = "Apache-2.0"

[dependencies]
async-channel = "2.5.0"
chrono = "0.4.45"
flate2 = "1.1.10"
fs2 = "0.4.3"
gpui-kit = "0.10.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lz4_flex = "0.14.0"
md-5 = "0.11.0"
nix = { version = "0.32.0", default-features = false, features = ["signal", "user"] }
pinyin = { version = "0.11.0", default-features = false, features = ["plain"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
sha2 = "0.11.1"
shipup = { version = "0.5.1", default-features = false, features = ["blocking", "rustls-tls"] }
smallvec = "1.16.3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "6.3.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
# 发布包优先控制体积：单 codegen unit、fat LTO、符号裁剪与 z 档优化。
# 不设置 panic = "abort"，保留 unwind，确保后台线程的 panic 隔离仍然有效。
opt-level = "z"
codegen-units = 1
lto = "fat"
strip = "symbols"

# 第三方依赖（GPUI/wgpu/字体整形）在开发档也需要优化，避免界面掉帧；
# 本 crate 保持 -1，避免打断断点调试。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# 本项目不需要 unsafe；用 lint 固化这一边界。
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

# pedantic 作为基线，噪声类规则显式放行，使 `cargo clippy -- -D warnings` 可作门禁。
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
doc_markdown = "allow"
missing_docs_in_private_items = "allow"
similar_names = "allow"
# 测试里 `assert!(x.is_empty(), "…{x:?}")` 已经带上了失败上下文，
# 换成 `assert_eq!(x, Vec::new())` 只是形状差异，不放行会持续制造噪声。
assert_is_empty = "allow"
# GPUI Kit 的门面把 Window/Context/Element 与样式 trait 集中在 crate 根，
# 官方用法就是 `use gpui_kit::*;`；逐项导入只会制造噪声。
wildcard_imports = "allow"
items_after_statements = "allow"

# Debian 打包元数据：由 cargo-deb 直接读取；仓库不提供二次封装脚本。
# `$auto` 让 cargo-deb 从产物的 ELF 依赖自己推导动态库清单，
# 不再手抄一份 libxcb-* 列表——那份清单每次换 GPUI/系统库版本都会过期。
[package.metadata.deb]
name = "debdeck"
# 清空 Debian 修订号：产物与 Version 都是 0.2.1，不再出现 0.2.1-1。
# 版本随 Cargo.toml 的 version 单一来源变化，不另设递增计数。
revision = ""
maintainer = "wangle <wangle@agree.com.cn>"
copyright = "2026, wangle <wangle@agree.com.cn>"
section = "admin"
priority = "optional"
depends = "apt, pkexec | policykit-1, xdg-utils, ca-certificates, libvulkan1, libegl1, hicolor-icon-theme, $auto"
recommends = "fonts-noto-cjk | fonts-wqy-microhei, libnotify-bin, mesa-vulkan-drivers"
maintainer-scripts = "debian/"
changelog = "debian/changelog"
# 许可证随包一起装到 /usr/share/doc 下，供用户就地查阅
license-file = "LICENSE"
extended-description = """
DebDeck 是面向 Ubuntu 的原生 APT/dpkg 应用管理器。它把已安装软件包与软件源中的
软件包合并到统一的可搜索目录，支持启动与卸载应用、保持软件包版本、下载 .deb
安装包、从已安装文件重建安装包，以及通过策略控制的管理员授权流程安装本地 .deb
文件。"""
assets = [
    ["target/release/debdeck", "usr/bin/debdeck", "755"],
    ["packaging/debdeck.desktop", "usr/share/applications/debdeck.desktop", "644"],
    ["packaging/49-debdeck.rules", "usr/share/polkit-1/rules.d/49-debdeck.rules", "644"],
    ["assets/logo/debdeck-logo.svg", "usr/share/icons/hicolor/scalable/apps/debdeck.svg", "644"],
    ["packaging/icons/16x16.png", "usr/share/icons/hicolor/16x16/apps/debdeck.png", "644"],
    ["packaging/icons/24x24.png", "usr/share/icons/hicolor/24x24/apps/debdeck.png", "644"],
    ["packaging/icons/32x32.png", "usr/share/icons/hicolor/32x32/apps/debdeck.png", "644"],
    ["packaging/icons/48x48.png", "usr/share/icons/hicolor/48x48/apps/debdeck.png", "644"],
    ["packaging/icons/64x64.png", "usr/share/icons/hicolor/64x64/apps/debdeck.png", "644"],
    ["packaging/icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/debdeck.png", "644"],
    ["packaging/icons/256x256.png", "usr/share/icons/hicolor/256x256/apps/debdeck.png", "644"],
    ["packaging/icons/512x512.png", "usr/share/icons/hicolor/512x512/apps/debdeck.png", "644"],
    ["packaging/icons/256x256.png", "usr/share/pixmaps/debdeck.png", "644"],
    ["README.md", "usr/share/doc/debdeck/README.md", "644"],
    ["README_zh-CN.md", "usr/share/doc/debdeck/README_zh-CN.md", "644"],
]

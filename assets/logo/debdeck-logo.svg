<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="DebDeck 软件包牌组图标">
  <defs>
    <linearGradient id="bg" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A2A"/>
      <stop offset="0.52" stop-color="#EA5311"/>
      <stop offset="1" stop-color="#B93408"/>
    </linearGradient>
    <linearGradient id="ring" x1="80" y1="72" x2="432" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE4C4"/>
      <stop offset="1" stop-color="#FFD096"/>
    </linearGradient>
    <linearGradient id="front-card" x1="196" y1="208" x2="326" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1E0"/>
    </linearGradient>
    <radialGradient id="inner" cx="0.34" cy="0.25" r="0.82">
      <stop offset="0" stop-color="#63230B"/>
      <stop offset="1" stop-color="#3D1205"/>
    </radialGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Porthole ring and field -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ring)" stroke-width="30"/>
  <circle cx="256" cy="256" r="161" fill="url(#inner)"/>

  <!-- Three package cards form a compact fan: software packages in a deck -->
  <g>
    <rect x="194" y="188" width="124" height="92" rx="23"
          fill="#FFD7AF" fill-opacity="0.56"
          transform="rotate(-31 256 320)"/>
    <rect x="194" y="188" width="124" height="92" rx="23"
          fill="#FFE4C7" fill-opacity="0.88"
          transform="rotate(31 256 320)"/>
    <g transform="rotate(-4 256 304)">
      <rect x="190" y="206" width="132" height="98" rx="24" fill="url(#front-card)"/>
      <!-- Minimal package mark on the front card -->
      <rect x="214" y="230" width="82" height="11" rx="5.5" fill="#D94A0D"/>
      <rect x="214" y="251" width="58" height="11" rx="5.5" fill="#E86625" fill-opacity="0.55"/>
      <rect x="214" y="272" width="68" height="11" rx="5.5" fill="#E86625" fill-opacity="0.32"/>
      <circle cx="305" cy="232" r="8" fill="#FBBF24"/>
    </g>
  </g>
</svg>
